<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON COAST COVER LAB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">NEON COAST <b>COVER LAB</b></div>
    <p class="tag">8 layouts &middot; 8 grades &middot; runs fully offline</p>
  </header>

  <div class="workbench">
    <aside class="panel" aria-label="cover controls">
      <section class="group">
        <h2>Photos — yours, never uploaded</h2>
        <label class="upload" for="upload">+ Upload your photos</label>
        <input type="file" id="upload" accept="image/*" multiple hidden />
        <div class="chips" id="photochips"></div>
      </section>

      <section class="group">
        <h2>One-click mood</h2>
        <div class="chips">
          <button type="button" data-preset="neon-night">Neon Night</button>
          <button type="button" data-preset="retro-sunset">Retro Sunset</button>
          <button type="button" data-preset="gritty-noir">Gritty Noir</button>
          <button type="button" data-preset="palm-gold">Palm Gold</button>
        </div>
      </section>

      <section class="group">
        <h2>Layout</h2>
        <div class="chips">
          <button type="button" data-layout="hero">Hero</button>
          <button type="button" data-layout="duo">Duo</button>
          <button type="button" data-layout="triptych">Triptych</button>
          <button type="button" data-layout="grid">Grid 4</button>
          <button type="button" data-layout="mosaic">Mosaic 9</button>
          <button type="button" data-layout="tilted">Tilted Stack</button>
          <button type="button" data-layout="strip">Hero + Strip</button>
          <button type="button" data-layout="comic">Comic 3</button>
        </div>
      </section>

      <section class="group">
        <h2>Grade</h2>
        <div class="chips">
          <button type="button" data-grade="sunset">Sunset</button>
          <button type="button" data-grade="neon">Neon</button>
          <button type="button" data-grade="noir">Noir</button>
          <button type="button" data-grade="vice">Vice</button>
          <button type="button" data-grade="gold">Gold</button>
          <button type="button" data-grade="miami">Miami</button>
          <button type="button" data-grade="dusk">Dusk</button>
          <button type="button" data-grade="palm">Palm</button>
        </div>
      </section>

      <section class="group">
        <h2>Export size</h2>
        <select id="size">
          <option value="square">Square &middot; 1080 &times; 1080</option>
          <option value="portrait">Portrait &middot; 1080 &times; 1350</option>
          <option value="wide">Wide &middot; 1920 &times; 1080</option>
        </select>
      </section>

      <section class="group">
        <h2>Panel <span id="panelcount" class="count"></span></h2>
        <select id="panel"></select>
        <p class="hint">Click a panel in the preview to select it. Drag it to pan, scroll to zoom.</p>
      </section>

      <section class="group sliders">
        <label>Zoom <output id="zoom-out">1.00</output></label>
        <input type="range" id="zoom" min="1" max="2.5" step="0.01" value="1" />
        <label>Crop X <output id="dx-out">0.00</output></label>
        <input type="range" id="dx" min="-0.5" max="0.5" step="0.01" value="0" />
        <label>Crop Y <output id="dy-out">0.00</output></label>
        <input type="range" id="dy" min="-0.5" max="0.5" step="0.01" value="0" />
        <label>Heat <output id="heat-out">5 / 5</output></label>
        <input type="range" id="heat" min="0" max="5" step="1" value="5" />
        <label>Grain <output id="grain-out">50%</output></label>
        <input type="range" id="grain" min="0" max="1" step="0.05" value="0.5" />
      </section>

      <section class="group">
        <h2>Words</h2>
        <input type="text" id="caption" value="NEON HEAT" placeholder="CAPTION" />
        <input type="text" id="tagline" value="VICE CITY AFTER DARK" placeholder="TAGLINE" />
        <input type="text" id="subtitle" value="midnight run" placeholder="script subtitle" />
        <select id="titlestyle">
          <option value="gradient">Title: gradient</option>
          <option value="solid">Title: solid</option>
          <option value="outline">Title: outline</option>
        </select>
      </section>

      <section class="group actions">
        <button type="button" id="export" class="primary">Export PNG</button>
        <button type="button" id="exportall">Export all 3</button>
      </section>
      <section class="group actions">
        <button type="button" id="undo">Undo</button>
        <button type="button" id="redo">Redo</button>
        <button type="button" id="shuffle">Shuffle</button>
        <button type="button" id="reset">Reset</button>
      </section>
    </aside>

    <main class="stage">
      <div class="frame">
        <canvas id="cover"></canvas>
      </div>
      <p id="status" class="status">Loading&hellip;</p>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
