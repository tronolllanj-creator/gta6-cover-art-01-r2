<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Lab — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-star">★</span> NEON COAST <span class="brand-sub">COVER LAB</span></div>
  <p class="tagline">Your photo. Your caption. A Vice City neon cover in one minute — offline, nothing uploaded.</p>
</header>
<main class="app">
  <section class="stage">
    <canvas id="cover" width="880" height="495" aria-label="The cover"></canvas>
    <p id="panelLabel" class="hint" role="status">Panel 1 of 2 — drag the cover to move it, scroll to zoom</p>
  </section>
  <aside class="controls">
    <h1>Make your cover</h1>
    <div class="group">
      <span class="label">1 · Layout</span>
      <div class="row">
        <button type="button" data-layout="slash" class="active">Neon Slash</button>
        <button type="button" data-layout="triptych">Triptych</button>
        <button type="button" data-layout="hero">Hero Frame</button>
      </div>
    </div>
    <div class="group">
      <span class="label">2 · Grade</span>
      <div class="row swatches">
        <button type="button" data-grade="vice" class="active" style="--sw1:#ff5e8a;--sw2:#2b1055">Vice Sunset</button>
        <button type="button" data-grade="neon" style="--sw1:#7b2fff;--sw2:#0b1035">Neon Night</button>
        <button type="button" data-grade="dusk" style="--sw1:#ff8a3d;--sw2:#3d0b3d">Palm Dusk</button>
        <button type="button" data-grade="gold" style="--sw1:#ffd76a;--sw2:#7a2d12">Gold Hour</button>
        <button type="button" data-grade="noir" style="--sw1:#ff4d6d;--sw2:#101014">Noir Pink</button>
        <button type="button" data-grade="mint" style="--sw1:#39ffb0;--sw2:#0b2b3d">Mint Vice</button>
      </div>
    </div>
    <div class="group">
      <span class="label">3 · Photos — one per panel</span>
      <label class="file">Panel 1 <input data-photo="0" type="file" accept="image/*"></label>
      <label class="file">Panel 2 <input data-photo="1" type="file" accept="image/*"></label>
      <label class="file">Panel 3 <input data-photo="2" type="file" accept="image/*"></label>
      <button id="fillAll" type="button" class="ghost">Fill every panel with the first photo</button>
    </div>
    <div class="group">
      <span class="label">4 · Words</span>
      <label class="field">Title <input id="title" type="text" maxlength="24" value="NEON COAST"></label>
      <label class="field">Subtitle <input id="subtitle" type="text" maxlength="40" value="SUNSET HEIST ON THE COAST"></label>
      <label class="field">Zoom panel <input id="zoom" type="range" min="0" max="150" value="0"></label>
    </div>
    <div class="group">
      <span class="label">5 · Size &amp; export</span>
      <div class="row">
        <button type="button" data-size="1920x1080" class="active">1920 × 1080</button>
        <button type="button" data-size="1080x1080">1080 × 1080</button>
        <button type="button" data-size="1080x1350">1080 × 1350</button>
      </div>
      <div class="row">
        <button type="button" data-export="1920x1080" class="export">Export landscape</button>
        <button type="button" data-export="1080x1080" class="export">Export square</button>
        <button type="button" data-export="1080x1350" class="export">Export portrait</button>
      </div>
    </div>
    <p id="status" role="status"></p>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
